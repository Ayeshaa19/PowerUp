<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="50%" stopColor="#172554"/>
      <stop offset="100%" stopColor="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- DUMBBELL (Left) -->
  <g transform="translate(90, 80) rotate(-7 100 160)">
    <!-- Top Outer Plate -->
    <rect x="20" y="30" width="90" height="25" rx="12" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <!-- Top Main Weight -->
    <rect x="5" y="55" width="120" height="46" rx="20" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <!-- Handle Bar -->
    <rect x="50" y="101" width="30" height="110" rx="8" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <line x1="45" y1="140" x2="85" y2="140" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
    <line x1="45" y1="170" x2="85" y2="170" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
    <!-- Bottom Main Weight -->
    <rect x="5" y="211" width="120" height="46" rx="20" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <!-- Bottom Outer Plate -->
    <rect x="20" y="257" width="90" height="25" rx="12" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  </g>

  <!-- LIGHTBULB WITH BRAIN (Right) -->
  <g transform="translate(280, 80)">
    <!-- 3 Radiant Light Rays -->
    <line x1="80" y1="10" x2="80" y2="30" stroke="#60A5FA" stroke-width="11" stroke-linecap="round"/>
    <line x1="40" y1="20" x2="55" y2="40" stroke="#60A5FA" stroke-width="11" stroke-linecap="round"/>
    <line x1="120" y1="20" x2="105" y2="40" stroke="#60A5FA" stroke-width="11" stroke-linecap="round"/>

    <!-- Lightbulb Outer Glass -->
    <path d="M 25 120 
             C 25 75, 50 45, 80 45 
             C 110 45, 135 75, 135 120 
             C 135 145, 120 165, 115 185 
             C 110 200, 105 210, 105 215 
             L 55 215 
             C 55 210, 50 200, 45 185 
             C 40 165, 25 145, 25 120 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

    <!-- Brain Fill inside Lightbulb -->
    <g transform="translate(42, 70)">
      <path d="M 10 40 
               C 5 30, 10 15, 22 10 
               C 30 5, 42 10, 47 17 
               C 52 10, 65 5, 72 10 
               C 85 15, 90 30, 85 40 
               C 92 47, 92 62, 85 70 
               C 80 75, 70 75, 65 70 
               C 55 80, 40 80, 30 70 
               C 25 75, 15 75, 10 70 
               C 2 62, 2 47, 10 40 Z" 
            fill="url(#brain-grad)"/>
      <path d="M 47 20 Q 47 60 47 70" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
      <path d="M 25 30 Q 35 40 30 55" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
      <path d="M 70 30 Q 60 40 65 55" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Base Screw Ribs -->
    <path d="M 55 220 Q 80 230 105 220" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 57 240 Q 80 250 103 240" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 60 260 Q 80 270 100 260" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 67 270 C 67 280, 93 280, 93 270" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="#FFFFFF"/>
  </g>

  <!-- PowerUp Typography -->
  <text x="256" y="445" text-anchor="middle" fill="#E0E7FF" font-size="76" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1px">
    PowerUp
  </text>
</svg>
